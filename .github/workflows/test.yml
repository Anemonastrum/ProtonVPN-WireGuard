name: Test Downloader and OpenClash Generator

on:
  pull_request:
    paths: ['generate_openclash.py', 'proton_login.py', 'proton_downloader_chrome.py', 'tests/**', 'requirements.txt', '.github/workflows/**']
  push:
    paths: ['generate_openclash.py', 'proton_login.py', 'proton_downloader_chrome.py', 'tests/**', 'requirements.txt', '.github/workflows/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
